<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title></title>
</head>
<header>
    <div class="header-box">
        <div class="header-content">
            <h1 class="website-title">VANTA</h1>
            <h2 class="home">Home</h2>
            <h2 class="Shop"><a href="shop.html">Shop</a></h2>
            <h2 class="wish-list">WishList</h2>
            <h2 class="cart">Cart</h2>
            <div class="icon">
                <img src="images/search-icon.png" class="search-icon" alt="search-button">
                <img src="images/profile-icon.png" class="profile-icon" alt="profile-button">
                <img src="images/cart-icon.png" class="cart-icon" alt="cart-button">
            </div>


        </div>
    </div>
</header>

<body class="home-body">
    <div class="background-content">
        <img src="images/background.png" class="background-image" alt="background-image">
        <h2 class="background-text">Better Style
            Bigger Dreams
        </h2>
        <p class="background-paragraph">
            Discover the latest trends and highly-quality products, all in one place
        </p>

        <button class="shop-now">Shop Now <img src="images/arrow-right.png" class="arrow"></button>

    </div>

    <div class="feature">
        <h3 class="feature-items">Feature Products</h3>
        <p class="view-all">View All <img src="images/arrow-right-2.png" class="arrow2"></p>
    </div>
    <div class="featured-products">
        <article class="product-card" data-id="1">
                <div class="image-wrapper">
                    <a href="product.html?id=1">
                        <img src="images/oversized-hoodie.png" class="product-image" alt="Oversized Hoodie">
                    </a>
                    <button class="wishlist-heart" aria-label="Add to wishlist">&#9825;</button>
                </div>
                <h3 class="product-name">Oversized Hoodie</h3>
                <p class="product-price">&#8369;1199</p>
                <button class="add-to-cart">Add to Cart</button>
            </article>
        <div>
            <a href="product.html"> <img src="images/oversized-hoodie.png" class="oversized-hoodie"
                    alt="oversized-hoodie"></a>
            <p class="product-name">Oversized Hoodie</p>
            <p class="product-price">&#8369; 1199</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>
        <div>
            <img src="images/gothic-bag.png" class="gothic-bag" alt="gothic-bag">
            <p class="product-name">Gothic Bag</p>
            <p class="product-price">&#8369; 1499</p>
            <button class="add-to-cart"> Add to Cart</button>
        </div>
        <div>
            <img src="images/gothic-boots.png" class="gothic-boots" alt="gothic-boots">
            <p class="product-name">Gothic Boots</p>
            <p class="product-price">&#8369; 1000</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>

    </div>

</body>

</html>
